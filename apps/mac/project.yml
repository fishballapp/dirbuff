name: DirBuff
options:
  bundleIdPrefix: app.fishball.dirbuff
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: "complete"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 9CWXH66CKT
    CODE_SIGN_IDENTITY: "Developer ID Application: Fishball Ltd (9CWXH66CKT)"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2129"

packages:
  DirBuffUI:
    path: ../../packages/ui
  DirBuffKit:
    path: ../../packages/kit
  DirBuffCore:
    path: ../../packages/core
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

targets:
  DirBuffFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: DirBuffFinder
      - path: Shared
    dependencies:
      - package: DirBuffUI
      - package: DirBuffCore
    settings:
      base:
        PRODUCT_NAME: DirBuffFinder
        PRODUCT_BUNDLE_IDENTIFIER: app.fishball.dirbuff.finder
        INFOPLIST_FILE: DirBuffFinder/Info.plist
        CODE_SIGN_ENTITLEMENTS: DirBuffFinder/DirBuffFinder.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  DirBuff:
    type: application
    platform: macOS
    sources:
      - path: DirBuff
      - path: Shared
    dependencies:
      - target: DirBuffFinder
        embed: true
      - package: DirBuffUI
      - package: DirBuffKit
      - package: DirBuffCore
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: DirBuff
        PRODUCT_BUNDLE_IDENTIFIER: app.fishball.dirbuff
        INFOPLIST_FILE: DirBuff/Info.plist
        CODE_SIGN_ENTITLEMENTS: DirBuff/DirBuff.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DIRBUFF_POLAR_API: "https:/$()/sandbox-api.polar.sh"
        DIRBUFF_POLAR_ORGANIZATION_ID: "06b3e001-297b-4ebd-bd97-c2008176dde0"
        DIRBUFF_POLAR_CHECKOUT_URL: "https:/$()/sandbox-api.polar.sh/v1/checkout-links/polar_cl_MrvqdeDKkaPJYQ0RL1RSC2a0zZFMGwXhTOTY411JLPB/redirect"
        DIRBUFF_POLAR_PORTAL_URL: "https:/$()/sandbox.polar.sh/fishball-ltd/portal"
        # The script below writes the release date into Info.plist, so it may edit the built bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # The pinned restic (restic/pin.env), built by restic/build.sh before this runs. It goes in
      # Contents/Helpers with its own signature (hardened runtime, a secure timestamp): the app's
      # signature only seals a nested program, it doesn't sign it, and notarisation refuses an
      # unsigned one. restic's licence goes in with it.
      - name: Embed restic
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          built="${SRCROOT}/.restic"
          if [[ ! -x "$built/restic" ]]; then
            echo "error: restic isn't built. Run apps/mac/restic/build.sh first." >&2
            exit 1
          fi
          helpers="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          notices="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ThirdPartyNotices"
          mkdir -p "$helpers" "$notices"
          cp "$built/restic" "$helpers/restic"
          cp "$built/LICENSE" "$notices/restic.txt"
          if [[ "${CODE_SIGNING_ALLOWED}" == YES && -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]]; then
            codesign --force --options runtime --timestamp \
              --identifier app.fishball.dirbuff.restic \
              --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$helpers/restic"
          fi
      # The day this version came out: release.sh passes DIRBUFF_RELEASE_DATE; any
      # other build is dated the day it is built, in UTC like the appcast's dates.
      - name: Stamp the release date
        basedOnDependencyAnalysis: false
        # Reading the built Info.plist makes Xcode process it first.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          day="${DIRBUFF_RELEASE_DATE:-$(date -u +%Y-%m-%d)}"
          plutil -replace DirBuffReleaseDate -string "$day" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
