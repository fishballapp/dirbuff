name: Release

# Two kinds of release, one job:
# - A version tag, `v<version>` on a commit of main, is a stable release. The private monorepo
#   pushes it here when its own `dirbuff-v<version>` tag is pushed (public-release-tags.yml there).
# - Every push to main is a dev build of that commit, served only to copies that chose the `dev`
#   update channel in Settings. The newest three are kept.
# Each builds, signs and notarises the DMG, publishes it as a GitHub release, then points the update
# feed at it.
#
# Its secrets live in 1Password and load through varlock (apps/mac/.env.schema). The one GitHub
# secret is DIRBUFF_OP_TOKEN, a service account that reads DirBuff's Environments only, held by the
# `release` environment, which only `main` and `v*` tags may read and which needs no approval: only
# the deploy key and the repo's admins push either, and the pr/<number> branches the private
# monorepo pushes here can't reach it.
on:
  push:
    tags: ['v*']
    branches: [main]

# A newer push to main makes the dev build still running pointless. Releases run one at a time and
# are never cancelled: two overlapping could leave GitHub's Latest and latest.json on the older one.
concurrency:
  group: ${{ github.ref_type == 'tag' && 'release' || 'dev-build' }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  release:
    name: Build, notarise, publish
    # A public repo's macOS minutes are free.
    runs-on: macos-26
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard (a tag on main only)
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; only a commit of main is released."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install the release tooling
        run: pnpm install --frozen-lockfile --filter @dirbuff/mac

      # Before the build: a missing changelog section, a tag that doesn't name MARKETING_VERSION or a
      # build number the feed would not offer should cost seconds, not a notarisation round trip.
      # It also names a dev build: its version and build number come from the commit count.
      - name: Preflight check
        id: preflight
        run: |
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            target=(--dev)
          else
            target=(--tag "$GITHUB_REF_NAME")
          fi
          node --experimental-strip-types apps/mac/release/publish.ts --check "${target[@]}" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Ensure XcodeGen
        run: command -v xcodegen || brew install xcodegen

      # Every line of every value is masked before any later step can print it.
      - name: Load secrets from 1Password
        env:
          DIRBUFF_OP_TOKEN: ${{ secrets.DIRBUFF_OP_TOKEN }}
        run: |
          node -e '
          const { execFileSync } = require("node:child_process");
          const { appendFileSync } = require("node:fs");
          const values = JSON.parse(
            execFileSync("pnpm", ["-F", "@dirbuff/mac", "exec", "varlock", "load", "--format", "json"], {
              encoding: "utf8",
            }),
          );
          for (const [key, value] of Object.entries(values)) {
            if (key === "DIRBUFF_OP_TOKEN" || typeof value !== "string" || value === "") continue;
            for (const line of value.split(/\r?\n/)) {
              if (line.trim() !== "") console.log(`::add-mask::${line}`);
            }
            appendFileSync(process.env.GITHUB_ENV, `${key}<<__EOF__\n${value}\n__EOF__\n`);
          }
          '

      - name: Setup throwaway keychain
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MAC_NATIVE_APP_APPLE_CERTIFICATE" | base64 -d > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAC_NATIVE_APP_APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERT_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # codesign looks for identities only in the search list, which a new keychain isn't on.
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application: Fishball Ltd (9CWXH66CKT)"

      - name: Build, sign, and notarise app
        env:
          DIRBUFF_VERSION: ${{ steps.preflight.outputs.version }}
          DIRBUFF_BUILD: ${{ steps.preflight.outputs.build }}
        run: ./apps/mac/release.sh

      # The DMG goes up, on the tag being released, before the feed names it: the feed must never
      # point at a file that is not there yet. A dev build has no tag yet: `--target` makes it, on
      # the commit built. A tag made by GITHUB_TOKEN starts no workflow, so it can't start this one
      # again (and the stable preflight would refuse it: it names no MARKETING_VERSION).
      - name: Publish the GitHub release
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            gh release create "v${VERSION}" "apps/mac/out/DirBuff-${VERSION}.dmg" \
              --title "DirBuff ${VERSION} (dev build)" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false
          else
            gh release create "v${VERSION}" "apps/mac/out/DirBuff-${VERSION}.dmg" \
              --title "DirBuff ${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag \
              --latest
          fi

      # The feed, then (for a dev build) the dev releases it no longer keeps: the feed is never left
      # naming a release that is gone.
      - name: Publish the update feed
        run: |
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            node --experimental-strip-types apps/mac/release/publish.ts --dev
          else
            node --experimental-strip-types apps/mac/release/publish.ts
          fi

      - name: Job summary
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          KIND=""
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then KIND=" (dev build)"; fi
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          # DirBuff ${VERSION}${KIND}

          - **Commit:** [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - **Release:** [v${VERSION}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION})
          - **Update feed:** [appcast.xml](https://dirbuff.fishball.app/appcast.xml)
          EOF

      - name: Teardown keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
