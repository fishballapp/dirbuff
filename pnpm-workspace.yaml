packages:
  - apps/mac
autoInstallPeers: true
strictPeerDependencies: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@baymutt/*"
  - baymutt
  - "@dynm.link/*"
  - "@fsh.ba/*"
  - "@gut.run/*"
  - "@openrepo/*"
  - "@socialized.dev/*"
  - "@yozz.app/*"
  - clapio
  - extship
  - self-hosted-artifacts
catalogMode: strict
cleanupUnusedCatalogs: true
overrides:
  "@types/node": "catalog:"
allowBuilds:
  "@biomejs/biome": true
  esbuild: true
catalog:
  "@baymutt/varlock-plugin": ^0.8.0
  "@biomejs/biome": ^2.5.13
  "@types/node": ^24.13.4
  effect: 4.0.0
  typescript: ~7.0.2
  varlock: ^1.24.0
  vitest: ^5.0.1
