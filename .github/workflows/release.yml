name: Release

# Run by hand from main (Actions → Release → Run workflow). The job builds, signs and notarises the
# DMG, publishes it as a GitHub release, then points the update feed at it.
#
# Its secrets live in 1Password and load through varlock (apps/mac/.env.schema). The one GitHub
# secret is DIRBUFF_OP_TOKEN, a service account that reads DirBuff's Environments only, held by the
# `release` environment, which only main may read and which waits for a maintainer's approval on
# every run: the pr/<number> branches the private monorepo pushes here can't reach it.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, notarise, publish
    # A public repo's macOS minutes are free.
    runs-on: macos-26
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Guard (main branch only)
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::The release workflow may only run on refs/heads/main (current: $GITHUB_REF)."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install the release tooling
        run: pnpm install --frozen-lockfile --filter @dirbuff/mac

      # Before the build: a missing changelog section, a taken tag or a build number the feed would
      # not offer should cost seconds, not a notarisation round trip.
      - name: Preflight check
        id: preflight
        run: node --experimental-strip-types apps/mac/release/publish.ts --check --notes-file "$RUNNER_TEMP/notes.md"

      - name: Ensure XcodeGen
        run: command -v xcodegen || brew install xcodegen

      # Every line of every value is masked before any later step can print it.
      - name: Load secrets from 1Password
        env:
          DIRBUFF_OP_TOKEN: ${{ secrets.DIRBUFF_OP_TOKEN }}
        run: |
          node -e '
          const { execFileSync } = require("node:child_process");
          const { appendFileSync } = require("node:fs");
          const values = JSON.parse(
            execFileSync("pnpm", ["-F", "@dirbuff/mac", "exec", "varlock", "load", "--format", "json"], {
              encoding: "utf8",
            }),
          );
          for (const [key, value] of Object.entries(values)) {
            if (key === "DIRBUFF_OP_TOKEN" || typeof value !== "string" || value === "") continue;
            for (const line of value.split(/\r?\n/)) {
              if (line.trim() !== "") console.log(`::add-mask::${line}`);
            }
            appendFileSync(process.env.GITHUB_ENV, `${key}<<__EOF__\n${value}\n__EOF__\n`);
          }
          '

      - name: Setup throwaway keychain
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MAC_NATIVE_APP_APPLE_CERTIFICATE" | base64 -d > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAC_NATIVE_APP_APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$CERT_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # codesign looks for identities only in the search list, which a new keychain isn't on.
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application: Fishball Ltd (9CWXH66CKT)"

      - name: Build, sign, and notarise app
        run: ./apps/mac/release.sh

      # The DMG goes up before the feed names it, and the tag comes with it: the feed must never
      # point at a file that is not there yet.
      - name: Publish the GitHub release
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          gh release create "v${VERSION}" "apps/mac/out/DirBuff-${VERSION}.dmg" \
            --title "DirBuff ${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Publish the update feed
        run: node --experimental-strip-types apps/mac/release/publish.ts

      - name: Job summary
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          # DirBuff ${VERSION}

          - **Commit:** [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - **Release:** [v${VERSION}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION})
          - **Update feed:** [appcast.xml](https://dirbuff.fishball.app/appcast.xml)
          EOF

      - name: Teardown keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
